name: paymenter
version: "1.0"
description: Paymenter billing panel (Laravel + MariaDB + Redis)

parameters:
  php_version:
    type: string
    default: "8.3"
    options: ["8.3", "8.4"]

services:
  app:
    image: "webdevops/php-nginx-dev:${php_version}"
    volumes:
      - "${site_root}:/app"
    ports:
      - "80"
    environment:
      WEB_DOCUMENT_ROOT: "/app/public"
      PHP_MEMORY_LIMIT: "512M"
      DB_CONNECTION: "mysql"
      DB_HOST: "apod-${site_domain}-db"
      DB_PORT: "3306"
      DB_DATABASE: "${site_db_name}"
      DB_USERNAME: "${site_db_user}"
      DB_PASSWORD: "${site_db_pass}"
      REDIS_HOST: "apod-${site_domain}-redis"
      REDIS_PORT: "6379"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      APP_URL: "https://${site_domain}"
      APP_ENV: "production"

  db:
    image: "mysql:8.0"
    environment:
      MYSQL_DATABASE: "${site_db_name}"
      MYSQL_USER: "${site_db_user}"
      MYSQL_PASSWORD: "${site_db_pass}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - "${data_root}/mysql:/var/lib/mysql"

  redis:
    image: "redis:7-alpine"
    volumes:
      - "${data_root}/redis:/data"

deploy:
  before_deploy:
    - "cd /app && composer install --no-dev --optimize-autoloader --no-interaction"
  after_deploy:
    - "cd /app && php artisan migrate --force"
    - "cd /app && php artisan optimize"

healthcheck:
  url: "http://localhost:80"
  interval: 10s
  timeout: 5s
  retries: 5

backup:
  paths:
    - "${site_root}"
  databases:
    - type: mysql
      service: db

setup:
  - name: "Wait for database"
    # PHP fsockopen wait — works even when the image ships no mysql client.
    command: "php -r 'for($i=0;$i<60;$i++){if($c=@fsockopen(\"apod-${site_domain}-db\",3306)){fclose($c);break;}sleep(1);}'"
    service: app
    optional: true
  - name: "Wait for Redis"
    command: "php -r 'for($i=0;$i<60;$i++){if($c=@fsockopen(\"apod-${site_domain}-redis\",6379)){fclose($c);break;}sleep(1);}'"
    service: app
    optional: true
  - name: "Download Paymenter"
    # -fSL: fail on an HTTP error instead of saving a 404 page. The trailing
    # tests make the step fail loudly (rolling the site back with a clear error)
    # if the archive didn't produce the expected layout — rather than leaving an
    # empty /app that nginx serves as a 500.
    command: "cd /app && if [ ! -f artisan ]; then curl -fSL https://github.com/paymenter/paymenter/releases/latest/download/paymenter.tar.gz -o /tmp/pm.tar.gz && tar -xzf /tmp/pm.tar.gz -C /app && rm -f /tmp/pm.tar.gz; fi && test -f /app/artisan && test -d /app/public"
    service: app
  - name: "Fix permissions"
    command: "cd /app && chmod -R 777 storage bootstrap/cache"
    service: app
    user: root
  - name: "Generate .env"
    command: "cd /app && if [ ! -f .env ]; then cp .env.example .env; fi"
    service: app
  - name: "Configure .env"
    command: "cd /app && sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env && sed -i 's|DB_HOST=.*|DB_HOST=apod-${site_domain}-db|' .env && sed -i 's|DB_PORT=.*|DB_PORT=3306|' .env && sed -i 's|DB_DATABASE=.*|DB_DATABASE=${site_db_name}|' .env && sed -i 's|DB_USERNAME=.*|DB_USERNAME=${site_db_user}|' .env && sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=${site_db_pass}|' .env && sed -i 's|REDIS_HOST=.*|REDIS_HOST=apod-${site_domain}-redis|' .env && sed -i 's|APP_URL=.*|APP_URL=https://${site_domain}|' .env"
    service: app
  - name: "Install dependencies"
    command: "cd /app && composer install --no-dev --optimize-autoloader --no-interaction"
    service: app
  - name: "Generate app key"
    command: "cd /app && if ! grep -q 'APP_KEY=base64' .env; then php artisan key:generate --force; fi"
    service: app
  - name: "Run migrations"
    command: "cd /app && php artisan migrate --force --seed 2>/dev/null || php artisan migrate --force"
    service: app
  - name: "Create storage link"
    command: "cd /app && php artisan storage:link 2>/dev/null || true"
    service: app
  - name: "Optimize"
    command: "cd /app && php artisan optimize 2>/dev/null || true"
    service: app
