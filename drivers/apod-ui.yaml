name: apod-ui
version: "1.0"
description: apod web UI — the admin panel, served on its own domain

parameters: {}

services:
  app:
    image: "ghcr.io/aystro-com/apod-ui:latest"
    ports:
      - "80"
    volumes:
      # Mount the daemon's control-socket DIRECTORY (read-only), not the socket
      # file — so the proxy keeps working across daemon restarts, which recreate
      # the socket with a new inode. nginx proxies /api and /webhook to it.
      - "/run/apod:/run/apod:ro"

healthcheck:
  url: "http://localhost:80"
  interval: 10s
  timeout: 5s
  retries: 3

setup: []
