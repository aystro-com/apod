name: odoo
version: "1.0"
description: Odoo ERP with PostgreSQL

parameters:
  odoo_version:
    type: string
    default: "17.0"
    options: ["16.0", "17.0", "18.0"]

services:
  app:
    image: "odoo:${odoo_version}"
    # The odoo image runs as uid 101; without this the root-owned bind mounts
    # are unwritable and the container crash-loops (panel shows a 404).
    data_owner: "101:101"
    volumes:
      - "${data_root}/odoo/data:/var/lib/odoo"
      - "${data_root}/odoo/addons:/mnt/extra-addons"
      - "${data_root}/odoo/config:/etc/odoo"
    ports:
      - "8069"
    environment:
      HOST: "apod-${site_domain}-db"
      PORT: "5432"
      USER: "${site_db_user}"
      PASSWORD: "${site_db_pass}"

  db:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "${site_db_user}"
      POSTGRES_PASSWORD: "${site_db_pass}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - "${data_root}/postgres:/var/lib/postgresql/data/pgdata"

# Generate odoo.conf before the container starts. The odoo entrypoint (and its
# wait-for-psql.py) read the DB connection from the [options] section of
# /etc/odoo/odoo.conf; without this file odoo crash-loops with
# "configparser.NoSectionError: No section: 'options'".
files:
  - path: "${data_root}/odoo/config/odoo.conf"
    content: |
      [options]
      admin_passwd = ${site_db_pass}
      db_host = apod-${site_domain}-db
      db_port = 5432
      db_user = ${site_db_user}
      db_password = ${site_db_pass}
      addons_path = /mnt/extra-addons
      data_dir = /var/lib/odoo

healthcheck:
  url: "http://localhost:8069"
  interval: 15s
  timeout: 10s
  retries: 5

backup:
  paths:
    - "${data_root}/odoo"
  databases:
    - type: postgres
      service: db

setup:
  - name: "Wait for PostgreSQL"
    command: "until pg_isready -h apod-${site_domain}-db -U ${site_db_user}; do sleep 2; done"
    service: db
    optional: true
  - name: "Fix Odoo permissions"
    command: "mkdir -p /var/lib/odoo/.local /var/lib/odoo/sessions /var/lib/odoo/filestore /etc/odoo /mnt/extra-addons && chown -R odoo:odoo /var/lib/odoo /mnt/extra-addons /etc/odoo"
    service: app
    user: root
    optional: true
