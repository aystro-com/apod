version: 2

builds:
  - id: apod-amd64
    main: ./cmd/apod
    binary: apod
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/aystro/apod/internal/engine.Version={{.Version}}

  - id: apod-arm64
    main: ./cmd/apod
    binary: apod
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/aystro/apod/internal/engine.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "apod_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign the checksum manifest with cosign (keyless / OIDC) so the integrity of a
# release doesn't rest on GitHub account security alone — install.sh and the
# self-updater can verify checksums.txt.sig against the release identity before
# trusting any checksum. Requires cosign in the release workflow; --yes avoids
# the interactive confirmation.
signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    output: true

release:
  github:
    owner: aystro-com
    name: apod

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
